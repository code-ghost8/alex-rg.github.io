<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  background:radial-gradient(circle at 30% 30%, #ff0a1f 0%, #7a0000 30%, #030a18 75%);
  overflow:hidden;padding:20px;position:relative;
}
.web{position:fixed;inset:0;pointer-events:none;z-index:1}
.web-line{
  position:absolute;width:2px;background:linear-gradient(to bottom, rgba(255,255,255,0.9), transparent);
  top:0;transform-origin:top;animation:swing 5s infinite ease-in-out;
}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

.spider{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:22px;filter:drop-shadow(0 0 6px red);
  animation: crawl linear infinite;
}
@keyframes crawl{
  0%{top:-5%;transform:translateX(-50%) rotate(0deg)}
  20%{transform:translateX(-50%) rotate(10deg)}
  40%{transform:translateX(-50%) rotate(-10deg)}
  60%{transform:translateX(-50%) rotate(10deg)}
  100%{top:110%;transform:translateX(-50%) rotate(0deg)}
}

.particle{
  position:absolute;width:4px;height:4px;border-radius:50%;
  animation:float 9s infinite linear;
}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-10vh) scale(1.5);opacity:0}
}
.container{
  position:relative;z-index:10;width:100%;max-width:380px;
  background:rgba(10,10,20,0.9);backdrop-filter:blur(18px);
  border:2px solid #ff0000;border-radius:32px;padding:35px 26px;
  text-align:center;box-shadow:0 0 40px rgba(255,0,0,0.6), 0 0 80px rgba(0,120,255,0.4);
  animation:glow 2.5s infinite alternate;
}
@keyframes glow{0%{box-shadow:0 0 30px rgba(255,0,0,0.5)}100%{box-shadow:0 0 60px rgba(255,0,0,0.9), 0 0 100px rgba(0,120,255,0.5)}}
.avatar{
  width:125px;height:125px;border-radius:50%;border:3px solid #ff0000;
  margin:0 auto 15px;background:url('foto.jpg') center top / cover;
  box-shadow:0 0 25px #ff0000, 0 0 0 5px rgba(0,120,255,0.4);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
h1{font-size:26px;color:white;font-weight:800;text-shadow:0 0 10px red}
.user{font-size:13px;color:#6ec8ff;font-weight:700;margin:4px 0 22px;letter-spacing:1px}
.link{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:14px;margin:12px 0;border-radius:50px;
  text-decoration:none;color:white;font-weight:800;font-size:15px;
  border:2px solid #000;box-shadow:4px 4px 0 #000;transition:0.15s;
}
.link:hover{transform:translateY(-3px) scale(1.03);box-shadow:6px 6px 0 #000}
.link:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.tiktok{background:#000}
.whatsapp{background:linear-gradient(90deg,#0a7a2a,#25D366)}
.instagram{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.facebook{background:linear-gradient(90deg,#0038ff,#1877F2)}
.footer{margin-top:18px;font-size:10px;color:#7fbfff;opacity:0.7}
</style>
</head>
<body>
<div class="web" id="web"></div>

<div class="container">
  <div class="avatar"></div>
  <h1>Alex RG 🕷️</h1>
  <a class="link tiktok" href="https://www.tiktok.com/@aleexrgk_" target="_blank">🕸️ TikTok</a>
  <a class="link whatsapp" href="https://wa.me/593969201026" target="_blank">💬 WhatsApp</a>
  <a class="link instagram" href="https://www.instagram.com/alexrgit" target="_blank">📸 Instagram</a>
  <a class="link facebook" href="https://www.facebook.com/daniel.gonzabay.948" target="_blank">📘 Facebook</a>
  <div class="footer">🕷️ Con gran poder viene gran responsabilidad </div>
</div>

<script>
const web = document.getElementById('web');
const positions = [5, 14, 23, 35, 48, 62, 75, 88, 95]; // donde van las telarañas

positions.forEach((left, i)=>{
  // linea
  let line = document.createElement('div');
  line.className = 'web-line';
  line.style.left = left+'%';
  line.style.height = (70 + Math.random()*40)+'%';
  line.style.animationDelay = (Math.random()*3)+'s';
  line.style.opacity = 0.4 + Math.random()*0.4;
  
  // solo en algunas ponemos arañita
  if([1,3,5,7].includes(i)){
    let spider = document.createElement('div');
    spider.className = 'spider';
    spider.textContent = '🕷️';
    spider.style.animationDuration = (7 + Math.random()*8)+'s';
    spider.style.animationDelay = (Math.random()*5)+'s';
    // arañas más grandes en algunas
    if(i==3) spider.style.fontSize='28px';
    line.appendChild(spider);
  }
  
  web.appendChild(line);
});

// particulas flotando rojo y azul
for(let i=0;i<20;i++){
  let p=document.createElement('div');
  p.className='particle';
  p.style.left=(Math.random()*100)+'%';
  p.style.animationDelay=(Math.random()*9)+'s';
  p.style.animationDuration=(6+Math.random()*6)+'s';
  let isRed = i%2==0;
  p.style.background=isRed?'#ff0000':'#00b7ff';
  p.style.boxShadow='0 0 10px '+(isRed?'#ff0000':'#00b7ff');
  web.appendChild(p);
}
</script>
</body>
</html>
